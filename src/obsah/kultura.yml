uvod:
  nadtitulek: plnotučná
  slovo: kultura
  dovetek: 100% živá
  popis_fotky: Kráva se pase na horské louce, u ní dvě děti.
odstavec:
  nadtitulek: kultura
  text: Hodnoty ladí náš srdeční kompas. Vrací nás na cestu, když ve spěchu a únavě zabloudíme. Tvoří a chrání kulturu pastvy. Přežvykujeme, dokud je nevstřebáme celé. Od pondělí do neděle. V práci, doma i ve škole. Nejen v kostele. Jinak jsou to jen krásné kecy na motivační cedule.
