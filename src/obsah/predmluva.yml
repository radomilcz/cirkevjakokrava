nadtitulek: Kdo jsme?
bloky:
  - druh: Malý titulek
    text: Dobrá zpráva
  - druh: Nadpis
    text: Češi nejsou ovce. Potřebují církev jako kráva.
  - druh: Odstavec
    text: Ptali jsme se, jak můžeme proříznout českou náboženskou šeď. Nabídnout čerstvý pohled na Krista, který bourá zeď předsudků a nedůvěry. Pak přišla ze zámoří zpráva. Chcete vidět změnu? Buďte fialová kráva.
  - druh: Odstavec
    text: To má být vtip? Pane, to nemyslíš vážně. A pak nám to došlo. Kráva je Boží! Je to fakt divný název, ale má neskutečnou sílu.
  - druh: Nadpis
    text: Minulost je past. Přítomnost je pastva.
  - druh: Odstavec
    text: 'Jasně. Jsme Češi. Církev je pro nás minulost. Uzavřená. Prostě past. Ale kráva? Je nadčasová. Normální. Odzbrojující. Lokální. Kde zabučí kráva, na církev nikdo nenadává. Vtahuje nás do děje. Smějeme se -> jsme zvědaví -> ptáme se:'
  - druh: Otázka
    text: Proč jako kráva?
  - druh: Odstavec
    text: Protože kráva patří na pastvu, ne do kostela. Žijeme tím, čím žije naše město. Fandíme všemu, co už v něm Bůh dělá. Ať to roste spolu s námi. Všude tam, kde pracujeme a platíme nájem. Dáváme srdce, čas a neředěný zájem.
  - druh: Nadpis
    text: Lásko, to je Kravařsko!
  - druh: Odstavec
    text: Kráva je tu domácí. Patří do krajiny stejně jako tráva. Přežvýká jetel, bodláčí i plevel. A pak přijde zázrak. Kráva se rozdává. Vrací zpátky víc, než si bere. Mléko. Smetanu. Telata. Dokonce i kravince jsou baterie pro půdní bakterie. Pastva pulzuje. Kráva ji kultivuje. Prospívá životu. Na každém kroku přidává hodnotu.
  - druh: Odstavec
    text: Kráva je úkaz. Dokud je tu, připomíná světu, že má laskavého Hospodáře. Kdyby odsud zmizela, tvář Kravařska by se k nepoznání změnila. Takoví chceme být i my.
  - druh: Odstavec
    text: Církev, která *by* Kravařsku chyběla.
otazka: Co to znamená?
