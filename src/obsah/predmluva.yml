nadtitulek: Kdo jsme?
kapitoly:
  - nadpis: Minulost je past. Přítomnost je pastva.
    odstavce:
      - "Jasně. Jsme Češi. Církev je pro nás minulost. Uzavřená. Prostě past.
        Ale kráva? Je nadčasová. Normální. Odzbrojující. Lokální. Kde zabučí
        kráva, na církev nikdo nenadává. Vtahuje nás do děje. Smějeme se -> jsme
        zvědaví -> ptáme se:"
    otazka: Proč jako kráva?
    odstavce_po_otazce:
      - Protože kráva patří na pastvu, ne do kostela. Žijeme tím, čím žije naše
        město. Fandíme všemu, co už v něm Bůh dělá. Ať to roste spolu s námi.
        Všude tam, kde pracujeme a platíme nájem. Dáváme srdce, čas a neředěný
        zájem.
  - maly_titulek: Dobrá zpráva
    nadpis: Češi nejsou ovce. Potřebují církev jako kráva.
    odstavce:
      - Ptali jsme se, jak můžeme proříznout českou náboženskou šeď. Nabídnout
        čerstvý pohled na Krista, který bourá zeď předsudků a nedůvěry. Pak
        přišla ze zámoří zpráva. Chcete vidět změnu? Buďte fialová kráva.
      - To má být vtip? Pane, to nemyslíš vážně. A pak nám to došlo. Kráva je
        Boží! Je to fakt divný název, ale má neskutečnou sílu.
  - nadpis: Lásko, to je Kravařsko!
    odstavce:
      - Kráva je tu domácí. Patří do krajiny stejně jako tráva. Přežvýká jetel,
        bodláčí i plevel. A pak přijde zázrak. Kráva se rozdává. Vrací zpátky
        víc, než si bere. Mléko. Smetanu. Telata. Dokonce i kravince jsou
        baterie pro půdní bakterie. Pastva pulzuje. Kráva ji kultivuje. Prospívá
        životu. Na každém kroku přidává hodnotu.
      - Kráva je úkaz. Dokud je tu, připomíná světu, že má laskavého Hospodáře.
        Kdyby odsud zmizela, tvář Kravařska by se k nepoznání změnila. Takoví
        chceme být i my.
      - Církev, která *by* Kravařsku chyběla.
otazka: Co to znamená?
