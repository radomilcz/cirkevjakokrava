slajdy:
- typ: vyrok
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Oslavujeme Boží náturu,
    kreativitu a lásku -> mezi
    lidmi na Kravařsku.
  otazka: Co (kdo) je na Kravařsku tvoje srdcovka a proč?
  otisk: '01'
  detail_odkaz: 'Bůh tvoří, my fandíme.'
  detail: |
    Když lidé tvoří pro druhé něco dobrého, není to náhoda. Vidíme v tom Boží design. Otisk původního záměru.

    Máme z toho radost až na kost. Tleskáme jim a říkáme to ostatním.

    Protože Boha oslavujeme i tím, komu fandíme. Nejen v kostele. Ale na pastvě.
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: vyrok
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Vnímáme, co Bůh kolem
    dělá. Přidáváme k tomu
    naše srdce, slova i ruce.
  otazka: Jak se přidáváš k Boží práci ve svém sousedství?
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: vyrok
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Tvoříme pastvu pro oči,
    uši a duši. Pro publikum,
    co kostel ani víru neřeší.
  otazka: Jakou pastvu tvoříš? Kdo (co) na ní roste?
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: vyrok
  nazev: Proč to děláme?
  nadtitulek: Proč to děláme?
  vyrok: |
    Aby lidé poznali, že Bohu
    na nich záleží. Uprostřed
    komunity, kam patříš i ty.
  otazka: Prožívají lidé Boží dotek v srdci komunity, kterou tvoříš i ty?
  otisk: '04'
