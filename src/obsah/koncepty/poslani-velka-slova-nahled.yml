  detail: |
    # Číslo v kravíně. Jméno na pastvě.

    ## Fandíme, makáme i tvoříme z jednoho důvodu: aby lidé zažili, že je Bůh zná a má je rád.

    Za vším, co v Novém Jičíně děláme, bije jedno společné přání. Sami jsme na vlastní kůži zažili, že Bůh je mnohem lepší, než jsme se báli: každého člověka zná jménem, rozumí jeho příběhu a stojí o něj. Stejnou úlevu a přijetí přejeme uprostřed všedního týdne sousedovi přes plot, kolegovi po noční i mámě z vedlejšího vchodu. Když přijde řeč na to, odkud bereme pokoj a naději, mluvíme o Ježíši přirozeně a s radostí. Za svou lásku ručíme my a proměnu srdce s důvěrou necháváme na Bohu, kterému na každém člověku záleží.

    > „Všechnu svou starost uvrhněte na něj, vždyť jemu na vás záleží.“
    > [1. Petrova 5,7](https://bible.com/bible/15/1PE.5.7.B21)

    [Na cestě] Naučíme se, jak se jmenují lidé z našeho vchodu, a budeme je zdravit jménem. Když se kolega zeptá, odkud bereme klid, řekneme mu obyčejnými slovy o Ježíši.

    [Na pastvě] S mladými se učíme vyprávět, co s Ježíšem zažíváme, bez zbožných frází. Kdo k nám přijde, může se na cokoli zeptat a nemusí s ničím souhlasit.

    [Ve městě] Za lidi z naší ulice se modlíme jménem, i když o tom nevědí. Když na náměstí uspořádáme zpívání koled, řekneme pár vět o tom, kdo je Ježíš.

    @ Zrcadlo

    Komu jsme poslední dobou mohli říct, co pro nás znamená Ježíš?

    Kolik sousedů a kolegů známe jménem a víme, co je trápí?

    Podle čeho by přátelé, kteří nevěří v Boha, poznali, že je máme rádi?
