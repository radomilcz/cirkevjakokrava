# Náhled (17. 10.): pilíře s obřím slovem (Fandíme / Makáme / Tvoříme / Toužíme) minimalisticky: číslo, obří slovo a pod ním zbytek věty z rozcestníku jako odkaz; otázka až v rozkliku. Build nečte.
slajdy:
- typ: rejstrik
  nazev: Pilíře
  nadtitulek: Čtyři pilíře
  # vyrok na chvíli pryč (17. 10.): „Zdravá kráva / chodí po čtyřech.“
  polozky:
  - cil: '01'
    text: Fandíme Boží práci kolem nás,
  - cil: '02'
    text: přidáváme se k lidem, co už ji dělají,
  - cil: '03'
    text: tvoříme pastvu pro ty, kteří církev neřeší,
  - cil: '04'
    text: ať na vlastní kůži poznají, že Bohu na nich záleží.
- typ: vyrok
  nazev: 01 Fandíme
  nadtitulek: '01'
  slovo: Fandíme
  # dovetek: oči  (navigace oči → ruce → hlava → srdce pryč, 17. 10.)
  # výrok z webu schovaný (17. 10.):
  #  Oslavujeme Boží náturu,
  #  kreativitu a lásku -> mezi
  #  lidmi na Kravařsku.
  otazka: Co (kdo) je na Kravařsku tvoje srdcovka a proč?
  otisk: '01'
  detail_odkaz: Boží práci kolem nás
  detail: |
    # Bůh tvoří, my fandíme.

    Boží vliv nezačíná u dveří kostela. Jeho tvořivost a péči vidíme ve městě každý den. V poctivém řemesle, dobrém jídle i v lidech, kteří se starají o druhé.

    Nejsme soupeři, ale fanoušci. Všímáme si toho, máme z toho radost a říkáme to lidem nahlas a do očí. Boha totiž oslavujeme i tím, komu fandíme.

    > „Bůh viděl všechno, co učinil, a hle, bylo to velmi dobré!“
    > [Genesis 1,31](https://bible.com/bible/15/GEN.1.31.B21)

    [V úterý] Pochval jednoho člověka za konkrétní věc, kterou dělá dobře. Třeba učitelku, se kterou tvůj kluk konečně pochopil zlomky. Do očí a pak i za zády.
