  vyrok: |
    Bohu a našemu městu
  detail: |
    # Bůh tvoří, my fandíme.

    ## Všechno dobré, co dělají lidé, spolky, firmy i úřady, je Boží dar, i když o tom sami třeba nevědí. Proto ve městě hledáme poklad, ne odpad.

    Bůh v Novém Jičíně pracoval dávno před námi a všechno dobré má svůj původ u něj. Jeho náturu vidíme v naší krajině i krajanech. Chodíme ulicemi s otevřenýma očima a všímáme si toho, co se lidem daří: čerstvého chleba z pekárny, učitelky, na kterou se děcka ráno těší, férové místní firmy i řidiče autobusu, co počká na dobíhajícího školáka. Mluvíme o svém městě dobře a nahlas chválíme to, co Bůh už schválil. Radost posíláme na dvě adresy: člověka pochválíme do očí i za jeho zády a Bohu poděkujeme za poklad, který do lidí vložil.

    > „Všechno dobré a dokonalé je dar shůry od Otce světel, u něhož není žádná změna, žádný proměnlivý stín.“
    > [Jakub 1,17](https://bible.com/bible/15/JAS.1.17.B21)

    > „Požehnáním poctivých se pozvedá město, ústy darebáků bývá bořeno.“
    > [Přísloví 11,11](https://bible.com/bible/15/PRO.11.11.B21)

    [Na cestě] Pokladní v obchodě řekneme, že nám její úsměv udělal radost. Když se u oběda nadává na město, řekneme, co se v něm daří.

    [Na pastvě] V neděli nahlas poděkujeme těm, kdo uvařili kávu a připravili sál. Když mladí připraví program, řekneme jim potom konkrétně, co se povedlo.

    [Ve městě] Učitelům a trenérům našich dětí napíšeme, čeho si na jejich práci vážíme. Dobrou místní kavárnu nebo firmu doporučíme známým a pochválíme ji v recenzi.

    @ Zrcadlo

    Komu jsme za poslední měsíc s radostí řekli, co dělá dobře?

    Podle čeho by sousedé poznali, že máme Nový Jičín rádi?

    Za koho z lidí kolem nás jsme Bohu poslední dobou poděkovali?
