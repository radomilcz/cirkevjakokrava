    pro lidi šťavnatou pastvu
  detail: |
    # Dobrá pastva je lákavá.

    ## Bůh dává bez rozdílu a nic za to nechce. Proto i my rádi nabízíme, co umíme, všem kolem sebe, i těm, kdo Ježíše ještě neznají.

    Chystáme v našem městě pastvu pro oči, uši a duši lidí, kterým je kostel cizí. Necháváme místo poctivé kráse a dobré hudbě a o životě i o víře mluvíme obyčejnou češtinou, jakou se bavíme doma nebo u piva. Otevíráme své obýváky a ke stolu s dobrým jídlem a kávou zveme dřív než do kostela. Štědrost a péče o každou maličkost jsou naším projevem úcty ke každému hostu: u našeho stolu má plnou svobodu, protože přátelství je pro nás cíl sám o sobě.

    > „Jsme přece jeho dílo! Bůh nás v Kristu Ježíši stvořil k dobrým skutkům, které předem připravil, abychom se jim věnovali.“
    > [Efezským 2,10](https://bible.com/bible/15/EPH.2.10.B21)

    [Na cestě] Sousedovým dětem pomůžeme s matikou před přijímačkami a nic za to nechceme. Když pečeme, upečeme víc a kus zaneseme sousedům, jen tak.

    [Na pastvě] Když někdo ze sboru přijde s nápadem, pomůžeme mu ho dotáhnout. Jídlo, hudbu i výzdobu chystáme pečlivě, aby se u nás hosté cítili vítaní.

    [Ve městě] Pro náctileté, kteří nemají kam jít, otevřeme v pátek klub s deskovkami. Rodičům s malými dětmi nabídneme dopoledne s kávou a hernou, bez kázání.

    @ Zrcadlo

    Co jsme za poslední půlrok udělali pro sousedy jen tak, pro radost?

    Podle čeho by hosté poznali, že jsme se na ně těšili a chystali?

    Co jsme letos ve městě rozjeli tam, kde nic nebylo?
