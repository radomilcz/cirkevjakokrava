  vyrok: |
    společně na jeho růstu
  detail: |
    # Tráva roste dřív než kráva.

    ## Když se daří městu, daří se i nám. Proto se rádi přidáváme k dobrým věcem, které už ve městě táhnou druzí, a umíme pomoct i poprosit.

    Poctivě odvedená směna v dílně, v nemocnici nebo u počítače má před Bohem stejnou váhu jako neděle u mikrofonu. Nový Jičín je náš domov, a tak s chutí přikládáme ruku všude tam, kde už sousedé, trenéři nebo místní spolky vedou dobrou věc. Táhneme s nimi za jeden provaz a s respektem podporujeme to, co rozjeli. A protože opravdové přátelství funguje oběma směry, stejně rádi si od souseda půjčíme nářadí, necháme si poradit nebo přijmeme pozvání k jeho stolu.

    > „Usilujte o prospěch města, do něhož jsem vás vystěhoval, a modlete se za ně k Hospodinu, neboť v jeho prospěchu je i váš prospěch.“
    > [Jeremiáš 29,7](https://bible.com/bible/15/JER.29.7.B21)

    [Na cestě] Svou práci odvedeme poctivě i tam, kde to nikdo nekontroluje. Od souseda si půjčíme nářadí a necháme si poradit, jak na to.

    [Na pastvě] V neděli se modlíme za to, co nás čeká v práci a ve škole. Program ve sboru nenafukujeme, aby lidem zbyl čas na spolky a oddíly.

    [Ve městě] S mladými se přidáme k jarnímu úklidu, který pořádají skauti nebo škola. Když spolek chystá městskou slavnost, přijdeme stavět stany a nosit lavice.

    @ Zrcadlo

    K čí dobré věci ve městě jsme se letos rádi přidali?

    Od koho jsme si za poslední měsíc nechali pomoct nebo poradit?

    Podle čeho by kolegové poznali, že nám na naší práci záleží?
