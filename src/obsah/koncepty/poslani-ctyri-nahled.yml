slajdy:
- typ: pilir
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Bůh tvoří.
    My fandíme.
  podnadpis: 'Vidíme Boží rukopis v lidech a městech kolem nás.'
  text: >-
    V Jičíně dělají klobouky, Ondrášek zpívá, trenéři dávají dětem svoje víkendy, parta uklízí potok. Není to náhoda. Je to odraz Boží lásky a kreativity v lidech. Proto jsme fanoušci našeho města, ne kritici. Jedno „děláš to skvěle“ hřeje celý týden.
  otazka: 'Komu tady fandíš? Ví o tom?'
  otisk: '01'
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: pilir
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Tráva roste
    dřív než kráva.
  podnadpis: 'Přidáváme se k lidem, kteří už dělají něco dobrého. Učíme se od nich a investujeme vlastní čas, ruce a peníze, aby to rostlo.'
  text: >-
    Ta parta od potoka má svoje pytle, svůj termín a svého šéfa. Nenosíme lepší plán. Nosíme holinky. Ptáme se, kam se postavit, a taháme z vody, co tam nepatří. Na konci zazní „Přijďte zas.“ A přijdeme. I za rok.
  otazka: 'Koho se zeptáš, s čím mu píchnout?'
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: pilir
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Každý něco umí.
    Každá něco dává.
  podnadpis: 'Tvoříme pastvu pro oči, uši a duši našeho města.'
  text: >-
    Koncert v Beskydském divadle dostane potlesk. Kabel pod pódiem nikdy. Pro Jičín je to jedna a ta samá práce. Obojí děláme pořádně, i tam, kam nikdo nekouká. Bez toho kabelu by nebylo co poslouchat.
  otazka: 'Co uděláš krásně? A co poctivě, i bez diváků?'
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: pilir
  nazev: Proč vlastně?
  nadtitulek: Proč vlastně?
  vyrok: |
    Číslo v kravíně.
    Jméno na pastvě.
  podnadpis: 'Chceme, aby lidi poznávali Boha tam, kde žijí.'
  text: >-
    Nesháníme členy. Stojíme se sousedkou u plotu a ptáme se, jak se má. Doopravdy. Časem už víme, že je to Věra a že má nemocného vnuka. Nic za to nežádáme. Stačí, když zjistí, že není nikomu ukradená. Ani nebi.
  otazka: 'Co si o Bohu myslí ti, co znají tebe?'
  otisk: '04'
