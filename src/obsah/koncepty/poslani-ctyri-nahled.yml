slajdy:
- typ: pilir
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Bůh tvoří.
    My fandíme.
  podnadpis: 'Oslavujeme Boží kreativitu a lásku → mezi lidmi na Kravařsku.'
  text: >-
    Žijí tu lidé, kteří mají tenhle kraj rádi a tvoří tu něco nového a dobrého. Není to náhoda. Vidíme v tom Boží rukopis. Máme z toho radost a dáváme jim to znát. Boha oslavujeme i tím, komu fandíme.
  otazka: 'Komu tady fandíš? Ví o tom?'
  otisk: '01'
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: pilir
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Tráva roste
    dřív než kráva.
  podnadpis: 'Přidáváme se k lidem, kteří už dělají něco dobrého. Učíme se od nich a investujeme vlastní čas, ruce a peníze, aby to rostlo.'
  text: >-
    Bůh tu pracoval dávno před námi a pracuje i teď. Stačí se podívat, co vzniká a kdo o to pečuje. Do toho vkládáme své srdce, slova i ruce. Modlíme se za ně, mluvíme o nich a jdeme pomáhat.
  otazka: 'Koho se zeptáš, s čím mu píchnout?'
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: pilir
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Každý něco umí.
    Každá něco dává.
  podnadpis: 'Krása je univerzální Boží jazyk.'
  text: >-
    Hlavně pro lidi, co kostel ani víru neřeší. Tvoříme pastvu pro oči, uši a duši našeho města. Místo, kde se může každý nadechnout, najíst a růst. Děláme to poctivě i tam, kde se nikdo nekouká.
  otazka: 'Co uděláš krásně? A co poctivě, i bez diváků?'
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: pilir
  nazev: Proč vlastně?
  nadtitulek: Proč vlastně?
  vyrok: |
    Číslo v kravíně.
    Jméno na pastvě.
  podnadpis: 'Chceme, aby lidi poznávali Boha tam, kde žijí.'
  text: >-
    Bohu na každém z nich záleží a přejeme si, aby to zažili na vlastní kůži. Uprostřed komunity, kam patříš i ty. Doma, v práci, ve škole. Bůh zná každého jménem, my se ta jména teprve učíme. Není to o nás. Je to o nich a o Něm.
  otazka: 'Co si o Bohu myslí ti, co znají tebe?'
  otisk: '04'
