slajdy:
- typ: pilir
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Bůh tvoří.
    My fandíme.
  podnadpis: 'Vidíme Boží rukopis v lidech a městech kolem nás.'
  text: >-
    Nový Jičín je plný dobrých věcí. Není to náhoda. Je to odraz Boží lásky a kreativity v lidech. Proto jsme fanoušci, ne kritici. A říkáme jim nahlas: děláte to skvěle.
  otazka: 'Komu tady fandíš? Ví o tom?'
  otisk: '01'
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: pilir
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Tráva roste
    dřív než kráva.
  podnadpis: 'Přidáváme se k lidem, kteří už dělají něco dobrého. Učíme se od nich a investujeme vlastní čas, ruce a peníze, aby to rostlo.'
  text: >-
    Bůh tu pracoval dávno před námi a pracuje i teď. Vnímáme, co dělá, a dáváme do toho srdce, slova i ruce. Napřed posloucháme. Vedou to oni, my jsme hosté.
  otazka: 'Koho se zeptáš, s čím mu píchnout?'
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: pilir
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Každý něco umí.
    Každá něco dává.
  podnadpis: 'Tvoříme pastvu pro oči, uši a duši našeho města.'
  text: >-
    Hlavně pro lidi, co kostel ani víru neřeší. Krása je vidět. Poctivost ne. Obojí patří k sobě. Pořádně to děláme tam, kde lidi tleskají, i tam, kam nikdo nekouká.
  otazka: 'Co uděláš krásně? A co poctivě, i bez diváků?'
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: pilir
  nazev: Proč vlastně?
  nadtitulek: Proč vlastně?
  vyrok: |
    Číslo v kravíně.
    Jméno na pastvě.
  podnadpis: 'Chceme, aby lidi poznávali Boha tam, kde žijí.'
  text: >-
    Bohu záleží na každém. I na tom, kdo do kostela nikdy nepřijde. Ať to zažije doma, v práci i v partě. Jsme s ním, když je těžko. Bez podmínek a bez náboru.
  otazka: 'Co si o Bohu myslí ti, co znají tebe?'
  otisk: '04'
