slajdy:
- typ: pilir
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Bůh tvoří.
    My fandíme.
  podnadpis: 'Vidíme Boží rukopis v lidech a městech kolem nás.'
  text: >-
    Nový Jičín je plný dobrých věcí. Není to náhoda. Je to odraz Boží lásky a kreativity v lidech. Proto jsme fanoušci, ne kritici. Tady dělají klobouky, Ondrášek zpívá, parta čistí potok. A my jim říkáme: děláte to skvěle.
  otazka: 'Komu tady fandíš? Ví o tom?'
  otisk: '01'
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: pilir
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Tráva roste
    dřív než kráva.
  podnadpis: 'Přidáváme se k lidem, kteří už dělají něco dobrého. Učíme se od nich a investujeme vlastní čas, ruce a peníze, aby to rostlo.'
  text: >-
    Nevymýšlíme akce od stolu. Jdeme tam, kde to už žije. Napřed se ptáme a posloucháme. Vedou to oni, my jsme hosté. Za partou od potoka nechodíme s lepším plánem, ale v holínkách. A za rok tam budeme zas.
  otazka: 'Koho se zeptáš, s čím mu píchnout?'
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: pilir
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Každý něco umí.
    Každá něco dává.
  podnadpis: 'Tvoříme pastvu pro oči, uši a duši našeho města.'
  text: >-
    Krása je vidět. Poctivost ne. Obojí patří k sobě. Pořádně děláme to, čemu lidi tleskají, i to, kam nikdo nekouká. Koncert v Beskydském divadle sklidí potlesk, kabel pod pódiem nikdy. Bez něj by ale nebylo co poslouchat.
  otazka: 'Co uděláš krásně? A co poctivě, i bez diváků?'
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: pilir
  nazev: Proč vlastně?
  nadtitulek: Proč vlastně?
  vyrok: |
    Číslo v kravíně.
    Jméno na pastvě.
  podnadpis: 'Chceme, aby lidi poznávali Boha tam, kde žijí.'
  text: >-
    Nesháníme členy. Stojíme o ty kolem nás a jsme s nimi, když je jim těžko. Bez podmínek. Třeba sousedka u plotu: časem zjistíme, že se jmenuje Věra a má nemocného vnuka. A ona ví, že není nikomu ukradená. Ani nebi.
  otazka: 'Co si o Bohu myslí ti, co znají tebe?'
  otisk: '04'
