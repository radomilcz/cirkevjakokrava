  otisk: '01'
  detail_odkaz: Oslavujeme Boží práci kolem nás
  detail: |
    # Bůh tvoří, my fandíme.

    Boží vliv nezačíná u dveří kostela. Jeho tvořivost a péči vidíme ve městě každý den. V poctivém řemesle, dobrém jídle i v lidech, kteří se starají o druhé.

    Nejsme soupeři, ale fanoušci. Všímáme si toho, máme z toho radost a říkáme to lidem nahlas a do očí. Boha totiž oslavujeme i tím, komu fandíme.

    > „Bůh viděl všechno, co učinil, a hle, bylo to velmi dobré!“
    > [Genesis 1,31](https://bible.com/bible/15/GEN.1.31.B21)

    [V úterý] Pochval jednoho člověka za konkrétní věc, kterou dělá dobře. Třeba učitelku, se kterou tvůj kluk konečně pochopil zlomky. Do očí a pak i za zády.
