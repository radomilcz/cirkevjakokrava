# Pracovní verze: tři pilíře (Radomil 9. 10.) – 01+02 sloučené. Jen náhled, build nečte.
slajdy:
- typ: vyrok
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Oslavujeme Boží náturu,
    kreativitu a lásku -> mezi
    lidmi na Kravařsku.
  otazka: Co (kdo) je na Kravařsku tvoje srdcovka a proč?
  otisk: '01'
  detail_odkaz: Tráva roste dřív než kráva.
  detail: |
    Bůh ve městě pracoval dávno před námi. Učíme se od něj. Stačí se podívat, co kolem vzniká a kdo o to s láskou pečuje. Do jejich práce pak vložíme své srdce, peníze i ruce. Modlíme se za ně a jdeme do toho s nimi.

    > Usilujte o prospěch města, do něhož jsem vás vystěhoval, a modlete se za ně k Hospodinu, neboť v jeho prospěchu je i váš prospěch.
    > [Jeremiáš 29,7](https://bible.com/bible/15/jer.29.7.B21)

    # Bůh tvoří, my fandíme.

    Když lidé dělají něco dobrého pro někoho jiného, není to náhoda. Vidíme v tom Boží design. Otisk jeho záměru.

    Máme z toho radost až na kost. Tleskáme jim. Říkáme to ostatním. A přidáváme se k nim. Protože Boha oslavujeme i tím, komu fandíme. Nejen že sedáme v kostele. Ale ke komu se přidáme na pastvě.

    > Cokoli je pravdivé, ušlechtilé, spravedlivé, čisté, milé, cokoli má dobrou pověst, je-li nějaká ctnost a nějaká chvála – o tom přemýšlejte.
    > [Filipským 4,8](https://bible.com/bible/15/php.4.8.B21)
