slajdy:
- typ: vyrok
  nazev: Co děláme?
  nadtitulek: Co děláme?
  vyrok: |
    Oslavujeme Boží náturu,
    kreativitu a lásku -> mezi
    lidmi na Kravařsku.
  otazka: Co (kdo) je na Kravařsku tvoje srdcovka a proč?
  otisk: '01'
  detail_odkaz: 'Bůh tvoří, my fandíme.'
  detail: |
    Když lidé tvoří pro druhé něco dobrého, není to náhoda. Vidíme v tom Boží design. Otisk jeho záměru.

    Máme z toho radost až na kost. Tleskáme jim a říkáme to ostatním.

    Protože Boha oslavujeme i tím, komu fandíme. Nejen v kostele. Ale na pastvě.

    > Cokoli je pravdivé, ušlechtilé, spravedlivé, čisté, milé, cokoli má dobrou pověst, je-li nějaká ctnost a nějaká chvála – o tom přemýšlejte.
    > [Filipským 4,8](https://bible.com/bible/15/php.4.8.B21)
- typ: vyrok_ruzovy
  nazev: Lásko, to je Kravařsko!
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: vyrok
  nazev: Jak to děláme?
  nadtitulek: Jak to děláme?
  vyrok: |
    Dobré slovo. Obě ruce.
    Celé srdce.
    Přidáváme k tomu,
    co Bůh svěřil druhým.
  otazka: Jak se přidáváš k Boží práci ve svém sousedství?
  otisk: '02'
- typ: kennedy
  nazev: Ich bin ein Kuhländler
  nadtitulek: Kuhländchen.
  vyrok: |
    Ich bin ein
    Kuhländler
  otazka: Je Kravařsko i tvoje srdeční záležitost?
  podpis: Herzenssache.
  popis_fotky: Vystřižený černobílý portrét Johna F. Kennedyho.
- typ: vyrok
  nazev: Pro koho?
  nadtitulek: Pro koho?
  vyrok: |
    Tvoříme pastvu pro oči,
    uši a duši. Pro publikum,
    co kostel ani víru neřeší.
  otazka: Jakou pastvu tvoříš? Kdo (co) na ní roste?
  otisk: '03'
- typ: fotka
  nazev: Kráva – má Boží design
  nadtitulek: pastva
  slovo: kráva
  dovetek: má Boží design
  bez_zavorek: true
  fotka: assets/fotky/krava-manifest.webp
  popis_fotky: Skotský náhorní skot zblízka, za ním dřevěná ohrada.
- typ: vyrok
  nazev: Proč to děláme?
  nadtitulek: Proč to děláme?
  vyrok: |
    Toužíme, aby lidé na vlastní kůži
    poznali, že je Bůh zná jménem.
    Překonali strach a zažili
    proměňující vztah.
  otazka: Prožívají lidé Boží dotek v srdci komunity, kterou tvoříš i ty?
  otisk: '04'
  detail_odkaz: 'Nechodíme do církve. Jsme církev, kudy chodíme.'
  detail: |
    Doma. V práci. Ve škole. V hospodě. U plotu se sousedem. Uprostřed komunity, kam patříš i ty.

    Bohu na každém z těch lidí záleží. Poznají to od souseda, kolegyně nebo spolužáka, ne z kazatelny.

    ### Číslo v kravíně. Jméno na pastvě.

    Ve světě jsme často jen čísla. Bůh zná každého jménem. My se ta jména teprve učíme.

    ### Láska mění kolemjdoucí v kumpány, tanečníky a gurmány.

    Není to o nás. Je to o nich a o Něm.
