<title>Hodnoty vedle sebe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky value switcher on top, then one row per section with three aligned columns (thoughts | main | Prigl); one column with a switch on phones. */
@font-face{font-family:"Agrandir";src:url("fonts/Agrandir-Regular.woff") format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"Agrandir Heavy";src:url("fonts/Agrandir-GrandHeavy.woff") format("woff");font-weight:800;font-display:swap}
@font-face{font-family:"Agrandir Narrow";src:url("fonts/Agrandir-NarrowBlack.woff") format("woff");font-weight:900;font-display:swap}
:root{
  --bg:#f9e7dd; --paper:#fff6f0; --ink:#3b2f2f; --muted:#7a6660; --line:#e8cfc3;
  --c-myslenky:#464994; --c-hlavni:#498660; --c-prigl:#b4545c;
  --pick:#498660; --pick-bg:#e3efe6;
  --f-display:"Agrandir Heavy","Arial Black",system-ui,sans-serif;
  --f-label:"Agrandir Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Agrandir",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211a1a; --paper:#2b2222; --ink:#f9e7dd; --muted:#c2aaa2; --line:#4a3c3a;
  --c-myslenky:#9fa2ea; --c-hlavni:#86c49c; --c-prigl:#eba6ad; --pick:#86c49c; --pick-bg:#24382b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211a1a; --paper:#2b2222; --ink:#f9e7dd; --muted:#c2aaa2; --line:#4a3c3a;
  --c-myslenky:#9fa2ea; --c-hlavni:#86c49c; --c-prigl:#eba6ad; --pick:#86c49c; --pick-bg:#24382b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.4vw,28px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--pick)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .cnt{font-size:11px;background:var(--pick);color:#fff;border-radius:999px;padding:0 6px;font-variant-numeric:tabular-nums}
.colswitch{display:none;gap:6px}
.colswitch button{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:6px;font:inherit;font-size:13px;cursor:pointer}
.colswitch button[aria-pressed="true"]{border-color:currentColor;font-weight:700}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
.vhead{display:flex;flex-direction:column;gap:4px}
.vhead h2{font-family:var(--f-display);font-size:clamp(24px,3.4vw,40px);margin:0;letter-spacing:-.02em}
.vhead p{margin:0;color:var(--muted)}
.cols-legend,.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.legend{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--paper);border-top:4px solid currentColor}
.legend small{display:block;text-transform:none;letter-spacing:0;font-family:var(--f-body);color:var(--muted);font-size:12px;margin-top:2px}
.legend.myslenky,.cell.myslenky .ch{color:var(--c-myslenky)}
.legend.hlavni,.cell.hlavni .ch{color:var(--c-hlavni)}
.legend.prigl,.cell.prigl .ch{color:var(--c-prigl)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;margin:6px 0 0;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.cell{min-width:0;background:var(--paper);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cell .ch{font-weight:700;font-size:13px}
.cell.empty{background:transparent;border:1px dashed var(--line);color:var(--muted);font-size:13px}
.blk{position:relative;border-radius:8px;padding:6px 8px;margin:0 -8px;transition:background .15s}
.blk p,.blk li{margin:0}
.lbl{font-size:13px;margin-top:4px;color:var(--muted)}
.blk.li{padding-left:22px}
.blk.li::before{content:"•";position:absolute;left:8px;top:6px;color:var(--muted)}
.blk.picked{background:var(--pick-bg);box-shadow:inset 3px 0 0 var(--pick)}
.pickbar{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.pickbtn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;cursor:pointer}
.pickbtn:hover{color:var(--ink);border-color:var(--ink)}
.picked .pickbtn{background:var(--pick);border-color:var(--pick);color:#fff}
.note{flex:1;min-width:160px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 8px;font:inherit;font-size:13px}
.pickbtn:focus-visible,.tab:focus-visible,.note:focus-visible,.colswitch button:focus-visible{outline:2px solid var(--c-myslenky);outline-offset:2px}
.notice{font-size:13px;color:var(--muted);background:var(--paper);border-radius:8px;padding:8px 12px}
.valued{background:var(--paper);border-radius:10px;padding:14px 16px;border-top:4px solid var(--c-prigl)}
.valued h3{margin:0 0 8px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--c-prigl)}
.valued ul{margin:0;padding-left:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:8px 24px}
.valued li{max-width:65ch}
.pill{display:inline-flex;align-items:center;gap:.3em;border:1px solid currentColor;color:var(--c-prigl);background:transparent;border-radius:999px;padding:0 .7em;font:inherit;font-size:12px;line-height:1.7;cursor:pointer;vertical-align:baseline;white-space:nowrap}
.pill::after{content:"+";font-weight:700}
.pill[aria-expanded="true"]{background:var(--c-prigl);color:var(--paper)}
.pill[aria-expanded="true"]::after{content:"−"}
.pill:focus-visible{outline:2px solid var(--c-myslenky);outline-offset:2px}
.vv{margin:.5em 0 .2em;padding:.6em .9em;border-left:3px solid var(--c-prigl);background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
.vv p{margin:0 0 .3em;font-style:italic}
.vv a{color:var(--c-prigl);font-size:12px}
.summary{background:var(--paper);border-radius:10px;padding:12px 14px}
.summary h3{margin:0 0 6px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--pick)}
.summary ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.summary .src{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
@media (max-width:900px){
  .colswitch{display:flex}
  .cols-legend,.row{grid-template-columns:minmax(0,1fr)}
  [data-show="myslenky"] .hlavni,[data-show="myslenky"] .prigl,
  [data-show="hlavni"] .myslenky,[data-show="hlavni"] .prigl,
  [data-show="prigl"] .myslenky,[data-show="prigl"] .hlavni{display:none}
}
@media (prefers-reduced-motion:reduce){.blk{transition:none}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><h1>Hodnoty vedle sebe</h1><span class="status" id="status">Výběr se načítá…</span></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Hodnoty"></nav>
  <div class="colswitch" id="colswitch" role="group" aria-label="Sloupec">
    <button type="button" data-col="myslenky">Definice</button>
    <button type="button" data-col="hlavni" aria-pressed="true">Varianta 1</button>
    <button type="button" data-col="prigl">Prigl</button>
  </div>
</div></header>
<main id="main" data-show="hlavni"><div class="wrap" id="view"></div></main>

<script>
const DATA = /*DATA*/null;
const COLS = [
  {k:"myslenky", name:"Definice", hint:"Přesné myšlenky bez metafor", pick:true},
  {k:"hlavni", name:"Varianta 1", hint:"Hlavní text v repu, schválený", pick:false},
  {k:"prigl", name:"Prigl", hint:"Vyprávění podle skillu prigl-tone", pick:true},
];
let cur = 1, picks = {}, db = null, dbState = "loading";
try { const h = parseInt(location.hash.slice(1).replace("hodnota-",""),10); if (h>=1 && h<=10) cur = h; } catch(e){}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
const pid = (n,col,sec,i) => `h${n}-${col}-${sec}-${i}`;

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = DATA.values.map(v => {
    const title = (v.hlavni && v.hlavni.title) || ("Hodnota " + v.n);
    const cnt = Object.values(picks).filter(p => p.n === v.n).length;
    return `<button class="tab" role="tab" aria-selected="${v.n===cur}" data-n="${v.n}">${esc(title)}${cnt?`<span class="cnt">${cnt}</span>`:""}</button>`;
  }).join("");
  t.querySelectorAll(".tab").forEach(b => b.onclick = () => { cur = +b.dataset.n; try{ history.replaceState(null,"","#hodnota-"+cur);}catch(e){ location.hash = "hodnota-"+cur; } render(); window.scrollTo({top:0}); });
  const sel = t.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({block:"nearest",inline:"nearest"});
}

function blockHTML(v, col, sec, b, i){
  const id = pid(v.n,col,sec,i), p = picks[id];
  if (b.t === "lbl") return `<div class="lbl">${b.h}</div>`;
  const pick = COLS.find(c=>c.k===col).pick;
  const inner = b.t === "li" ? `<li style="list-style:none">${b.h}</li>` : `<p>${b.h}</p>`;
  let bar = "";
  if (pick && dbState === "ready") {
    bar = `<div class="pickbar"><button type="button" class="pickbtn" data-id="${id}" aria-pressed="${!!p}">${p ? "✓ Vzít do hlavní" : "＋ Vzít do hlavní"}</button>${p ? `<input class="note" id="note-${id}" data-id="${id}" placeholder="Poznámka: kam a jak…" value="${esc(p.note||"")}">` : ""}</div>`;
  }
  return `<div class="blk ${b.t==="li"?"li":""} ${p?"picked":""}">${inner}${bar}</div>`;
}

function render(){
  renderTabs();
  const v = DATA.values.find(x => x.n === cur);
  const title = (v.hlavni && v.hlavni.title) || "";
  const sub = (v.hlavni && v.hlavni.sub) || "";
  let h = `<div class="vhead"><h2>${esc(title)}</h2><p>${sub}</p></div>`;
  if (v.hodnotne && v.hodnotne.length) h += `<section class="valued"><h3>Co má pro nás hodnotu</h3><ul>${v.hodnotne.map((x,i)=>`<li>${x.h}${x.verse?` <button type="button" class="pill" aria-expanded="false" aria-controls="vv-${v.n}-${i}">${esc(x.verse.ref)}</button><blockquote class="vv" id="vv-${v.n}-${i}" hidden><p>${esc(x.verse.text)}</p><a href="${esc(x.verse.url)}" target="_blank" rel="noopener">${esc(x.verse.ref)}, Bible21</a></blockquote>`:""}</li>`).join("")}</ul></section>`;
  if (dbState === "none") h += `<div class="notice">Výběr se tady neukládá (nejsi přihlášený nebo stránka nemá přístup k úložišti). Číst a porovnávat můžeš normálně.</div>`;
  h += `<div class="cols-legend">${COLS.map(c=>`<div class="legend ${c.k}">${c.name}<small>${c.hint}</small></div>`).join("")}</div>`;
  for (const [sec, label] of DATA.order){
    const any = COLS.some(c => v[c.k] && v[c.k].secs[sec].blocks.length);
    if (!any) continue;
    h += `<section class="sec"><h3>${esc(label)}</h3><div class="row">`;
    for (const c of COLS){
      const col = v[c.k];
      const s = col && col.secs[sec];
      if (!col) { h += `<div class="cell ${c.k} empty">Tahle varianta se ještě píše.</div>`; continue; }
      if (!s || !s.blocks.length) { h += `<div class="cell ${c.k} empty">V této variantě tenhle oddíl není.</div>`; continue; }
      const head = s.heading && !["Rámeček"].includes(s.heading) ? `<div class="ch">${s.heading}</div>` : "";
      h += `<div class="cell ${c.k}">${head}${s.blocks.map((b,i)=>blockHTML(v,c.k,sec,b,i)).join("")}</div>`;
    }
    h += `</div></section>`;
  }
  const mine = Object.values(picks).filter(p => p.n === cur).sort((a,b)=> (a.order||0)-(b.order||0));
  if (mine.length){
    h += `<div class="summary"><h3>Vybráno do hlavní verze (${mine.length})</h3><ol>${mine.map(p=>`<li><span class="src">${esc(p.colName)} · ${esc(p.secName)}</span><br>${esc(p.text)}${p.note?`<br><em>Poznámka: ${esc(p.note)}</em>`:""}</li>`).join("")}</ol></div>`;
  }
  const view = document.getElementById("view");
  view.innerHTML = h;
  view.querySelectorAll(".pill").forEach(b => b.onclick = () => { const q = document.getElementById(b.getAttribute("aria-controls")); const open = b.getAttribute("aria-expanded") !== "true"; b.setAttribute("aria-expanded", open); q.hidden = !open; });
  view.querySelectorAll(".pickbtn").forEach(b => b.onclick = () => togglePick(b.dataset.id));
  view.querySelectorAll(".note").forEach(inp => inp.onchange = () => saveNote(inp.dataset.id, inp.value));
  updateStatus();
}

function updateStatus(){
  const s = document.getElementById("status");
  const n = Object.keys(picks).length;
  if (dbState === "loading") s.textContent = "Výběr se načítá…";
  else if (dbState === "none") s.textContent = "Jen ke čtení";
  else s.innerHTML = n ? `Vybráno celkem: <b>${n}</b>` : "Zatím nic nevybráno";
}

async function togglePick(id){
  if (!db) return;
  const [hn, col, sec, i] = id.split("-");
  const n = +hn.slice(1), v = DATA.values.find(x=>x.n===n);
  const ref = db.collection("picks").doc(id);
  try {
    if (picks[id]) await ref.delete();
    else {
      const b = v[col].secs[sec].blocks[+i];
      const secIdx = DATA.order.findIndex(o=>o[0]===sec);
      await ref.set({n, col, colName: COLS.find(c=>c.k===col).name, sec, secName: DATA.order[secIdx][1], idx: +i,
        order: n*10000 + secIdx*100 + (col==="myslenky"?0:50) + (+i), text: plain(b.h), note: "", at: Date.now()});
    }
  } catch(e){ document.getElementById("status").textContent = "Uložení se nepovedlo, zkus to znovu."; }
}
async function saveNote(id, note){
  if (!db || !picks[id]) return;
  try { await db.collection("picks").doc(id).update({note}); } catch(e){ document.getElementById("status").textContent = "Poznámka se neuložila."; }
}

document.getElementById("colswitch").querySelectorAll("button").forEach(b => b.onclick = () => {
  document.getElementById("main").dataset.show = b.dataset.col;
  document.querySelectorAll("#colswitch button").forEach(x => x.setAttribute("aria-pressed", x===b));
  try{ localStorage.setItem("vedle-col", b.dataset.col); }catch(e){}
});
try{ const c = localStorage.getItem("vedle-col"); if (c){ const b = document.querySelector(`#colswitch [data-col="${c}"]`); if (b) b.click(); } }catch(e){}
addEventListener("hashchange", () => { const h = parseInt(location.hash.slice(1).replace("hodnota-",""),10); if (h>=1 && h<=10 && h!==cur){ cur=h; render(); } });

render();
(async () => {
  const timer = setTimeout(() => { if (dbState==="loading"){ dbState="none"; render(); } }, 10000);
  try { db = window.claude && await window.claude.use("db"); } catch(e){ db = null; }
  if (!db){ clearTimeout(timer); dbState = "none"; render(); return; }
  db.collection("picks").onSnapshot(snap => {
    clearTimeout(timer);
    picks = {}; snap.docs.forEach(d => { picks[d.id] = d.data(); });
    const active = document.activeElement, aid = active && active.id;
    dbState = "ready"; render();
    if (aid){ const el = document.getElementById(aid); if (el) el.focus(); }
  }, () => { clearTimeout(timer); dbState = "none"; render(); });
})();
</script>
