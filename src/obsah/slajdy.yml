slajdy:
- typ: uvod
  nadtitulek: manifest
  napis: BŮŮŮH
  podnadpis: je dobrý, my jsme normální
  fotka: assets/fotky/hero.webp
  popis_fotky: Dívka stojí na pastvině vedle skotského náhorního skotu.
- typ: predmluva
  nadtitulek: Kdo jsme?
  kapitoly:
  - tagline: Dobrá zpráva
    nadpis: Češi nejsou ovce. Potřebují církev jako kráva.
    text: |
      Ptali jsme se, jak můžeme proříznout českou náboženskou šeď. Nabídnout čerstvý pohled na Krista, který bourá zeď předsudků a nedůvěry. Pak přišla ze zámoří zpráva. Chcete vidět změnu? Buďte fialová kráva.

      To má být vtip? Pane, to nemyslíš vážně. A pak nám to došlo. Kráva je Boží! Je to fakt divný název, ale má neskutečnou sílu.
  - nadpis: Minulost je past. Přítomnost je pastva.
    text: |
      Jasně. Jsme Češi. Církev je pro nás minulost. Uzavřená. Prostě past. Ale kráva? Je nadčasová. Normální. Odzbrojující. Lokální. Kde zabučí kráva, na církev nikdo nenadává. Vtahuje nás do děje. Smějeme se → jsme zvědaví → ptáme se:

      > Proč jako kráva?

      Protože kráva patří na pastvu, ne do kostela. Žijeme tím, čím žije naše město. Fandíme všemu, co už v něm Bůh dělá. Ať to roste spolu s námi. Všude tam, kde pracujeme a platíme nájem. Dáváme srdce, čas a neředěný zájem.
  - nadpis: Lásko, to je Kravařsko!
    text: |
      Kráva je tu domácí. Patří do krajiny stejně jako tráva. Přežvýká jetel, bodláčí i plevel. A pak přijde zázrak. Kráva se rozdává. Vrací zpátky víc, než si bere. Mléko. Smetanu. Telata. Dokonce i kravince jsou baterie pro půdní bakterie. Pastva pulzuje. Kráva ji kultivuje. Prospívá životu. Na každém kroku přidává hodnotu.

      Kráva je úkaz. Dokud je tu, připomíná světu, že má laskavého Hospodáře. Kdyby odsud zmizela, tvář Kravařska by se k nepoznání změnila. Takoví chceme být i my.

      Církev, která *by* Kravařsku chyběla.
  otazka: Co to znamená?
- typ: vyrok
  nadtitulek: Co děláme?
  vyrok: |
    Oslavujeme Boží kreativitu
    a lásku -> k lidem a městům
    na Kravařsku.
  otazka: Co (kdo) je na Kravařsku tvoje srdcovka a proč?
  otisk: '01'
- typ: vyrok_ruzovy
  nadtitulek: Kuhländchen.
  vyrok: |
    Lásko, to je
    Kravařsko!
  podpis: Herzenssache.
  otisk: '05'
- typ: vyrok
