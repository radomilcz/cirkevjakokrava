# Pages CMS (pagescms.org) – texty manifestu. Přihlášení GitHubem na app.pagescms.org.
# Co se tu uloží, to GitHub Action přesází na web (.github/workflows/web.yml).
# Skupiny slajdů jdou na webu v pořadí jako tady v menu, mezi nimi je čárka na liště.
# Uvnitř skupiny se slajdy přidávají, přetahují a mažou. Otisky a čísla dopočítá build.

media:
  input: src/assets/fotky
  output: assets/fotky
  categories:
    - image
  rename: safe

content:
  - name: uvod
    label: Úvod
    type: file
    path: src/obsah/skupiny/uvod.yml
    format: yaml
    fields:
      - name: slajdy
        label: Slajdy
        type: block
        blockKey: typ
        required: true
        list:
          collapsible:
            collapsed: true
            summary: '{nadtitulek} {slovo}'
        blocks:
          - name: uvod
            label: Úvod
            type: object
            fields:
              - name: nadtitulek
                label: Nadtitulek
                type: string
                required: true
              - name: napis
                label: Velký nápis
                type: string
                required: true
              - name: podnadpis
                label: Podnadpis
                type: string
                required: true
              - name: fotka
                label: Fotka
                type: image
                required: true
              - name: popis_fotky
                label: Popis fotky
                type: string
          - name: predmluva
            label: Předmluva
            type: object
            fields:
              - name: nadtitulek
                label: Nadtitulek
                type: string
                required: true
              - name: kapitoly
                label: Kapitoly
                type: object
                required: true
                list:
                  collapsible:
                    collapsed: true
                    summary: '{nadpis}'
                fields:
                  - name: tagline
                    label: Tagline
                    type: string
                  - name: nadpis
                    label: Nadpis
                    type: string
                    required: true
                  - name: text
                    label: Text
                    type: rich-text
                    required: true
                    options:
                      format: markdown
                      switcher: false
                      media: false
                    description: Citace = zvýrazněná otázka
              - name: otazka
                label: Otázka dole
                type: string
          - name: vyrok
            label: Výrok
            type: object
            fields:
              - name: nadtitulek
                label: Nadtitulek
                type: string
                required: true
              - name: vyrok
                label: Výrok
                type: text
                required: true
                description: Co řádek, to řádek na slajdu.
              - name: otazka
                label: Otázka
                type: string
              - name: podpis
                label: Podpis
                type: string
                description: Prázdné = společný podpis.
              - name: otisk
                label: Otisk
                type: select
                options:
                  values:
                    - value: auto
                      label: Automaticky
                    - value: '01'
                      label: Poloha 1
                    - value: '02'
