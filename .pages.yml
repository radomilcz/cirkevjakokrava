# Pages CMS (pagescms.org) – texty manifestu. Přihlášení GitHubem na app.pagescms.org.
# Co se tu uloží, to GitHub Action přesází na web (.github/workflows/web.yml).
#
# Tři úrovně: skupina (položka v menu) → slajd (řádek v seznamu, přetahuje se) → objekt (pole).
# Skupiny jdou na webu v pořadí jako tady v menu, mezi nimi je čárka na liště.
# Nová skupina = zkopírovat jeden řádek v `content` a změnit name/label/path.
#
# Pole jsou definovaná jednou v `components`. Povinné pole má `pattern` (česká hláška už při
# uložení, bez anglického „Required“); build povinnost hlídá znovu a rozbitý obsah nepustí na web.

media:
  input: src/assets/fotky
  output: assets/fotky
  categories: [image]
  rename: safe

components:
  nazev:      {type: string, label: Název}
  nadtitulek: {type: string, label: Nadtitulek, pattern: {regex: '\S', message: Doplň nadtitulek}}
  slovo:      {type: string, label: Velké slovo, pattern: {regex: '\S', message: Doplň velké slovo}}
  dovetek:    {type: string, label: Dovětek}
  podnadpis:  {type: string, label: Podnadpis, pattern: {regex: '\S', message: Doplň podnadpis}}
  vyrok:      {type: text, label: Výrok, pattern: {regex: '\S', message: Doplň výrok}}
  otazka:     {type: string, label: Otázka}
  podpis:     {type: string, label: Podpis}
  fotka:      {type: image, label: Fotka}
  popis_fotky: {type: string, label: Popis fotky}
  text:       {type: text, label: Text, pattern: {regex: '\S', message: Doplň text}}
  otisk:
    type: select
    label: Otisk
    options:
      placeholder: Automaticky
      values:
        - {value: '01', label: Poloha 1}
        - {value: '02', label: Poloha 2}
        - {value: '03', label: Poloha 3}
        - {value: '04', label: Poloha 4}
        - {value: '05', label: Poloha 5}
        - {value: h02, label: Poloha 6}
        - {value: h03, label: Poloha 7}
        - {value: h04, label: Poloha 8}
        - {value: h05, label: Poloha 9}
        - {value: h06, label: Poloha 10}
        - {value: h07, label: Poloha 11}
        - {value: h08, label: Poloha 12}
        - {value: h09, label: Poloha 13}
        - {value: h10, label: Poloha 14}
        - {value: h11, label: Poloha 15}
        - {value: zrcadlo, label: Poloha 16}

  slajdy:
    type: block
    label: false
    blockKey: typ
    list:
      collapsible: {collapsed: true, summary: '{nazev}'}
    blocks:
      - name: vyrok
        label: Výrok
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: vyrok, component: vyrok}
          - {name: otazka, component: otazka}
          - {name: podpis, component: podpis}
          - {name: otisk, component: otisk}
      - name: pilir
        label: Pilíř
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: vyrok, component: vyrok}
          - {name: text, component: text}
          - {name: otazka, component: otazka}
          - {name: otisk, component: otisk}
      - name: vyrok_ruzovy
        label: Výrok na růžovém
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: vyrok, component: vyrok}
          - {name: otazka, component: otazka}
          - {name: podpis, component: podpis}
      - name: fotka
        label: Fotka se slovem
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: slovo, component: slovo}
          - {name: dovetek, component: dovetek}
          - {name: bez_zavorek, type: boolean, label: Dovětek bez závorek}
          - {name: fotka, component: fotka}
          - {name: popis_fotky, component: popis_fotky}
      - name: hodnota
        label: Hodnota
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: slovo, component: slovo}
          - {name: dovetek, component: dovetek, pattern: {regex: '\S', message: Doplň dovětek}}
          - {name: otisk, component: otisk}
      - name: odstavec
        label: Odstavec
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: text, component: text}
      - name: uvod
        label: Úvod
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: slovo, component: slovo}
          - {name: podnadpis, component: podnadpis}
          - {name: fotka, component: fotka}
          - {name: popis_fotky, component: popis_fotky}
      - name: predmluva
        label: Předmluva
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - name: kapitoly
            label: Kapitoly
            type: object
            list:
              collapsible: {collapsed: true, summary: '{nadpis}'}
            fields:
              - {name: tagline, type: string, label: Tagline}
              - {name: nadpis, type: string, label: Nadpis, pattern: {regex: '\S', message: Doplň nadpis}}
              - name: text
                type: rich-text
                label: Text
                pattern: {regex: '\S', message: Doplň text}
                options: {format: markdown, switcher: false, media: false}
          - {name: otazka, component: otazka}
      - name: zrcadlo
        label: Zrcadlo
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: slovo, component: slovo}
          - {name: otazka, component: otazka}
          - {name: fotka, component: fotka}
          - {name: popis_fotky, component: popis_fotky}
          - {name: otisk, component: otisk}
      - name: kennedy
        label: Kennedy
        fields:
          - {name: nazev, component: nazev}
          - {name: nadtitulek, component: nadtitulek}
          - {name: vyrok, component: vyrok}
          - {name: otazka, component: otazka}
          - {name: podpis, component: podpis}
          - {name: popis_fotky, component: popis_fotky}

content:
  - {name: uvod, label: Úvod, type: file, format: yaml, path: src/obsah/skupiny/uvod.yml, fields: [{name: slajdy, component: slajdy}]}
  - {name: poslani, label: Poslání, type: file, format: yaml, path: src/obsah/skupiny/poslani.yml, fields: [{name: slajdy, component: slajdy}]}
  - {name: kultura, label: Kultura, type: file, format: yaml, path: src/obsah/skupiny/kultura.yml, fields: [{name: slajdy, component: slajdy}]}
  - {name: zaver, label: Závěr, type: file, format: yaml, path: src/obsah/skupiny/zaver.yml, fields: [{name: slajdy, component: slajdy}]}

  - name: spolecne
    label: Nastavení
    type: file
    format: yaml
    path: src/obsah/spolecne.yml
    fields:
      - {name: podpis, type: string, label: Společný podpis, pattern: {regex: '\S', message: Doplň podpis}}
      - {name: napoveda, type: string, label: Nápověda k ovládání}
      - name: sdileni
        label: Sdílení odkazu
        type: object
        fields:
          - {name: titulek_stranky, type: string, label: Název v prohlížeči, pattern: {regex: '\S', message: Doplň název}}
          - {name: titulek_nahledu, type: string, label: Titulek náhledu, pattern: {regex: '\S', message: Doplň titulek}}
          - {name: popis, type: text, label: Popis, pattern: {regex: '\S', message: Doplň popis}}
          - {name: popis_obrazku, type: string, label: Popis obrázku}

settings:
  content:
    merge: true
  commit:
    templates:
      create: 'Texty: nový {path}'
      update: 'Texty: {path}'
      delete: 'Texty: smazán {path}'
      rename: 'Texty: {oldPath} → {newPath}'
