# Nastavení pro Pages CMS (pagescms.org) – webová administrace textů manifestu.
# Přihlásíš se GitHubem na app.pagescms.org, vybereš repozitář a píšeš do formulářů.
# CMS uloží soubor do src/obsah/, GitHub Actions z něj přesází web (.github/workflows/web.yml).
#
# Sekce jdou ve stejném pořadí jako slajdy.
# Slajdy se tu nepřidávají ani nepřehazují – pořadí drží design (otisky, fotky, animace).

content:
  - name: uvod
    label: Úvod
    type: file
    path: src/obsah/uvod.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: napis
        label: Velký nápis
        type: string
        required: true
      - name: podnadpis
        label: Podnadpis
        type: string
        required: true
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: predmluva
    label: Předmluva
    type: file
    path: src/obsah/predmluva.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: text
        label: Text předmluvy
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: false
        description: Nadpis 2 = nadpis · Nadpis 3 = tagline · Citace = zvýrazněná otázka · Kurzíva = kurzíva
      - name: otazka
        label: Otázka dole
        type: string

  - name: poslani
    label: Poslání
    type: file
    path: src/obsah/poslani.yml
    format: yaml
    fields:
      - name: co_delame
        label: Co děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: lasko
        label: Lásko, to je Kravařsko!
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: jak_to_delame
        label: Jak to děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: kennedy
        label: Ich bin ein Kuhländler
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok – přesně dva řádky
            type: string
            list:
              min: 2
              max: 2
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
          - name: popis_fotky
            label: Popis portrétu
            type: string
      - name: pro_koho
        label: Pro koho?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: krava
        label: Kráva má Boží design
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: proc
        label: Proč vlastně?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.

  - name: kultura
    label: Kultura a hodnoty
    type: file
    path: src/obsah/kultura.yml
    format: yaml
    fields:
      - name: uvod
        label: Kultura – slajd s fotkou
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: odstavec
        label: Odstavec o hodnotách
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: text
            label: Text
            type: text
            required: true
      - name: nadtitulek_hodnot
        label: Nadtitulek slajdů s hodnotami
        type: string
        required: true
      - name: hodnoty
        label: Hodnoty
        type: object
        list:
          min: 10
          max: 10
          collapsible:
            collapsed: true
            summary: '{slovo} – {jak}'
        fields:
          - name: slovo
            label: Hodnota
            type: string
            required: true
          - name: jak
            label: Jak
            type: string
            required: true

  - name: zrcadlo
    label: Zrcadlo
    type: file
    path: src/obsah/zrcadlo.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: slovo
        label: Velké slovo
        type: string
        required: true
      - name: otazka
        label: Otázka k zamyšlení
        type: string
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: spolecne
    label: Společné a sdílení
    type: file
    path: src/obsah/spolecne.yml
    format: yaml
    fields:
      - name: podpis
        label: Podpis
        type: string
        required: true
      - name: napoveda
        label: Nápověda k ovládání
        type: string
      - name: sdileni
        label: Sdílení odkazu
        type: object
        fields:
          - name: titulek_stranky
            label: Název v panelu prohlížeče
            type: string
            required: true
          - name: titulek_nahledu
            label: Titulek náhledu
            type: string
            required: true
          - name: popis
            label: Popis
            type: text
            required: true
          - name: popis_obrazku
            label: Popis obrázku náhledu
            type: string
settings:
  content:
    merge: true
