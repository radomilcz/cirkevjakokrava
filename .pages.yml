# Nastavení pro Pages CMS (pagescms.org) – webová administrace textů manifestu.
# Přihlásíš se GitHubem na app.pagescms.org, vybereš repozitář a píšeš do formulářů.
# CMS uloží soubor do src/obsah/, GitHub Actions z něj přesází web (.github/workflows/web.yml).
#
# Sekce jdou ve stejném pořadí jako slajdy, čísla v názvech sedí s tečkami na liště webu.
# Slajdy se tu nepřidávají ani nepřehazují – pořadí drží design (otisky, fotky, animace).

content:
  - name: uvod
    label: 00 · Úvod
    type: file
    path: src/obsah/uvod.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: napis
        label: Velký nápis
        type: string
        required: true
      - name: podnadpis
        label: Podnadpis
        type: string
        required: true
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: predmluva
    label: 01 · Předmluva
    type: file
    path: src/obsah/predmluva.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: kapitoly
        label: Kapitoly
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{nadpis}'
        fields:
          - name: maly_titulek
            label: Tagline
            type: string
          - name: nadpis
            label: Nadpis
            type: string
            required: true
          - name: odstavce
            label: Odstavce
            type: text
            list: true
            required: true
          - name: otazka
            label: Zvýrazněná otázka
            type: string
          - name: odstavce_po_otazce
            label: Odstavce za otázkou
            type: text
            list: true
      - name: otazka
        label: Otázka dole
        type: string

  - name: poslani
    label: 02–08 · Poslání
    type: file
    path: src/obsah/poslani.yml
    format: yaml
    fields:
      - name: co_delame
        label: 02 · Co děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: lasko
        label: 03 · Lásko, to je Kravařsko!
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: jak_to_delame
        label: 04 · Jak to děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: kennedy
        label: 05 · Ich bin ein Kuhländler
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok – přesně dva řádky
            type: string
            list:
              min: 2
              max: 2
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
          - name: popis_fotky
            label: Popis portrétu
            type: string
      - name: pro_koho
        label: 06 · Pro koho?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.
      - name: krava
        label: 07 · Kráva má Boží design
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: proc
        label: 08 · Proč vlastně?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Prázdné = společný podpis.

  - name: kultura
    label: 09–20 · Kultura a hodnoty
    type: file
    path: src/obsah/kultura.yml
    format: yaml
    fields:
      - name: uvod
        label: 09 · Kultura – slajd s fotkou
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: odstavec
        label: 10 · Odstavec o hodnotách
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: text
            label: Text
            type: text
            required: true
      - name: nadtitulek_hodnot
        label: Nadtitulek slajdů s hodnotami
        type: string
        required: true
      - name: hodnoty
        label: 11–20 · Hodnoty
        type: object
        list:
          min: 10
          max: 10
          collapsible:
            collapsed: true
            summary: '{slovo} – {jak}'
        fields:
          - name: slovo
            label: Hodnota
            type: string
            required: true
          - name: jak
            label: Jak
            type: string
            required: true

  - name: zrcadlo
    label: 21 · Zrcadlo
    type: file
    path: src/obsah/zrcadlo.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: slovo
        label: Velké slovo
        type: string
        required: true
      - name: otazka
        label: Otázka k zamyšlení
        type: string
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: spolecne
    label: Společné a sdílení
    type: file
    path: src/obsah/spolecne.yml
    format: yaml
    fields:
      - name: podpis
        label: Podpis
        type: string
        required: true
      - name: napoveda
        label: Nápověda k ovládání
        type: string
      - name: sdileni
        label: Sdílení odkazu
        type: object
        fields:
          - name: titulek_stranky
            label: Název v panelu prohlížeče
            type: string
            required: true
          - name: titulek_nahledu
            label: Titulek náhledu
            type: string
            required: true
          - name: popis
            label: Popis
            type: text
            required: true
          - name: popis_obrazku
            label: Popis obrázku náhledu
            type: string
settings:
  content:
    merge: true
