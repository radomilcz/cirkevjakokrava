# Pages CMS (pagescms.org) – texty manifestu. Přihlášení GitHubem na app.pagescms.org.
# Co se tu uloží, to GitHub Action přesází na web (.github/workflows/web.yml).
# Každý slajd má svou položku v menu; pořadí slajdů drží design, proto se tu nepřidávají.

content:
  - name: uvod
    label: Úvod
    type: file
    path: src/obsah/uvod.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: napis
        label: Velký nápis
        type: string
        required: true
      - name: podnadpis
        label: Podnadpis
        type: string
        required: true
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: predmluva
    label: Předmluva
    type: file
    path: src/obsah/predmluva.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: text
        label: Text
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: false
          media: false
        description: Nadpis 2 = nadpis · Nadpis 3 = tagline · Citace = zvýrazněná otázka
      - name: otazka
        label: Otázka dole
        type: string

  - name: poslani
    label: Poslání
    type: group
    items:
      - name: co_delame
        label: Co děláme?
        type: file
        path: src/obsah/poslani/co-delame.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Co řádek, to řádek na slajdu.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.
      - name: lasko
        label: Lásko, to je Kravařsko!
        type: file
        path: src/obsah/poslani/lasko-to-je-kravarsko.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Co řádek, to řádek na slajdu.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.
      - name: jak_to_delame
        label: Jak to děláme?
        type: file
        path: src/obsah/poslani/jak-to-delame.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Co řádek, to řádek na slajdu.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.
      - name: kennedy
        label: Ich bin ein Kuhländler
        type: file
        path: src/obsah/poslani/ich-bin-ein-kuhlander.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Přesně dva řádky – malý a velký.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.
          - name: popis_fotky
            label: Popis portrétu
            type: string
      - name: pro_koho
        label: Pro koho?
        type: file
        path: src/obsah/poslani/pro-koho.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Co řádek, to řádek na slajdu.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.
      - name: krava
        label: Kráva má Boží design
        type: file
        path: src/obsah/poslani/krava.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: proc
        label: Proč vlastně?
        type: file
        path: src/obsah/poslani/proc-vlastne.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok
            type: text
            required: true
            description: Co řádek, to řádek na slajdu.
          - name: otazka
            label: Otázka
            type: string
          - name: podpis
            label: Podpis
            type: string
            description: Prázdné = společný podpis.

  - name: kultura
    label: Kultura
    type: group
    items:
      - name: uvod
        label: Úvod kultury
        type: file
        path: src/obsah/kultura/uvod.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: slovo
            label: Velké slovo
            type: string
            required: true
          - name: dovetek
            label: Dovětek
            type: string
          - name: popis_fotky
            label: Popis fotky
            type: string
      - name: odstavec
        label: Odstavec
        type: file
        path: src/obsah/kultura/odstavec.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: text
            label: Text
            type: text
            required: true
      - name: hodnoty
        label: Hodnoty
        type: file
        path: src/obsah/kultura/hodnoty.yml
        format: yaml
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: hodnoty
            label: Hodnoty
            type: object
            list:
              min: 10
              max: 10
              collapsible:
                collapsed: true
                summary: '{slovo} – {jak}'
            fields:
              - name: slovo
                label: Hodnota
                type: string
                required: true
              - name: jak
                label: Jak
                type: string
                required: true

  - name: zrcadlo
    label: Zrcadlo
    type: file
    path: src/obsah/zrcadlo.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: slovo
        label: Velké slovo
        type: string
        required: true
      - name: otazka
        label: Otázka
        type: string
      - name: popis_fotky
        label: Popis fotky
        type: string

  - name: spolecne
    label: Nastavení
    type: file
    path: src/obsah/spolecne.yml
    format: yaml
    fields:
      - name: podpis
        label: Společný podpis
        type: string
        required: true
      - name: napoveda
        label: Nápověda k ovládání
        type: string
      - name: sdileni
        label: Sdílení odkazu
        type: object
        fields:
          - name: titulek_stranky
            label: Název v prohlížeči
            type: string
            required: true
          - name: titulek_nahledu
            label: Titulek náhledu
            type: string
            required: true
          - name: popis
            label: Popis
            type: text
            required: true
          - name: popis_obrazku
            label: Popis obrázku
            type: string
settings:
  content:
    merge: true
