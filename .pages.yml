# Nastavení pro Pages CMS (pagescms.org) – webová administrace textů manifestu.
# Přihlásíš se GitHubem na app.pagescms.org, vybereš repozitář a píšeš do formulářů.
# CMS uloží soubor do src/obsah/, GitHub Actions z něj přesází web (.github/workflows/web.yml).
#
# Sekce jdou ve stejném pořadí jako slajdy, čísla v názvech sedí s tečkami na liště webu.
# Slajdy se tu nepřidávají ani nepřehazují – pořadí drží design (otisky, fotky, animace).

content:
  - name: uvod
    label: 00 · Úvod
    type: file
    path: src/obsah/uvod.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
        description: Malý text vlevo nahoře – „manifest“.
      - name: napis
        label: Velký nápis
        type: string
        required: true
        description: Každé písmeno vyjede zvlášť. Krátké slovo, verzálkami – „BŮŮŮH“.
      - name: podnadpis
        label: Podnadpis
        type: string
        required: true
        description: Věta pod velkým nápisem.
      - name: popis_fotky
        label: Popis fotky
        type: string
        description: Pro nevidomé a vyhledávače. Co je na fotce, jednou větou.

  - name: predmluva
    label: 01 · Předmluva
    type: file
    path: src/obsah/predmluva.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
        description: Malý text vlevo nahoře – „Kdo jsme?“.
      - name: bloky
        label: Text předmluvy
        type: object
        list: true
        description: Bloky jdou shora dolů přesně tak, jak jsou tady. Přetažením je přeskládáš, tlačítkem
          přidáš nový odstavec, nadpis nebo otázku.
        collapsible:
          collapsed: true
          summary: '{druh}: {text}'
        fields:
          - name: druh
            label: Druh
            type: select
            required: true
            options:
              values:
                - Malý titulek
                - Nadpis
                - Odstavec
                - Otázka
            description: Malý titulek = drobný řádek nad nadpisem („Dobrá zpráva“). Nadpis = tučný mezititulek.
              Odstavec = běžný text. Otázka = zvýrazněná otázka mezi odstavci („Proč jako kráva?“).
          - name: text
            label: Text
            type: text
            required: true
            description: Šipku napiš jako ->, kurzívu jako *slovo*.
      - name: otazka
        label: Otázka dole
        type: string
        description: Drobná otázka vlevo dole na konci předmluvy – „Co to znamená?“.

  - name: poslani
    label: 02–08 · Poslání
    type: file
    path: src/obsah/poslani.yml
    format: yaml
    fields:
      - name: co_delame
        label: 02 · Co děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
            description: Každá položka je jeden řádek na slajdu – zalomení drží sazbu z Figmy, tak ať
              jsou řádky zhruba stejně dlouhé. Šipku napiš jako ->.
          - name: otazka
            label: Otázka k zamyšlení
            type: string
            description: Drobná otázka vlevo dole. Když zůstane prázdná, na slajdu nebude.
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis (Společné → Podpis).
      - name: lasko
        label: 03 · Lásko, to je Kravařsko!
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
            description: Každá položka je jeden řádek na slajdu.
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis.
      - name: jak_to_delame
        label: 04 · Jak to děláme?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
            description: Každá položka je jeden řádek na slajdu – zalomení drží sazbu z Figmy, tak ať
              jsou řádky zhruba stejně dlouhé. Šipku napiš jako ->.
          - name: otazka
            label: Otázka k zamyšlení
            type: string
            description: Drobná otázka vlevo dole. Když zůstane prázdná, na slajdu nebude.
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis (Společné → Podpis).
      - name: kennedy
        label: 05 · Ich bin ein Kuhländler
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: vyrok
            label: Výrok – přesně dva řádky
            type: string
            list:
              min: 2
              max: 2
            required: true
            description: První řádek je menší, druhý velký přes portrét. Víc řádků se do kompozice nevejde.
          - name: otazka
            label: Otázka k zamyšlení
            type: string
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis.
          - name: popis_fotky
            label: Popis portrétu
            type: string
            description: Pro nevidomé a vyhledávače.
      - name: pro_koho
        label: 06 · Pro koho?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
            description: Každá položka je jeden řádek na slajdu – zalomení drží sazbu z Figmy, tak ať
              jsou řádky zhruba stejně dlouhé. Šipku napiš jako ->.
          - name: otazka
            label: Otázka k zamyšlení
            type: string
            description: Drobná otázka vlevo dole. Když zůstane prázdná, na slajdu nebude.
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis (Společné → Podpis).
      - name: krava
        label: 07 · Kráva má Boží design
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: slovo
            label: Velké slovo
            type: string
            required: true
            description: Jedno slovo přes celou fotku, malými písmeny.
          - name: dovetek
            label: Dovětek
            type: string
            description: Drobný text vedle velkého slova.
          - name: popis_fotky
            label: Popis fotky
            type: string
            description: Pro nevidomé a vyhledávače.
      - name: proc
        label: 08 · Proč vlastně?
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: vyrok
            label: Výrok po řádcích
            type: string
            list: true
            required: true
            description: Každá položka je jeden řádek na slajdu – zalomení drží sazbu z Figmy, tak ať
              jsou řádky zhruba stejně dlouhé. Šipku napiš jako ->.
          - name: otazka
            label: Otázka k zamyšlení
            type: string
            description: Drobná otázka vlevo dole. Když zůstane prázdná, na slajdu nebude.
          - name: podpis
            label: Podpis vpravo dole
            type: string
            description: Nech prázdné a bude tam společný podpis (Společné → Podpis).

  - name: kultura
    label: 09–20 · Kultura a hodnoty
    type: file
    path: src/obsah/kultura.yml
    format: yaml
    fields:
      - name: uvod
        label: 09 · Kultura – slajd s fotkou
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
            description: Malý text vlevo nahoře.
          - name: slovo
            label: Velké slovo
            type: string
            required: true
            description: Jedno slovo přes celou fotku, malými písmeny.
          - name: dovetek
            label: Dovětek
            type: string
            description: Drobný text vedle velkého slova.
          - name: popis_fotky
            label: Popis fotky
            type: string
            description: Pro nevidomé a vyhledávače.
      - name: odstavec
        label: 10 · Odstavec o hodnotách
        type: object
        fields:
          - name: nadtitulek
            label: Nadtitulek
            type: string
            required: true
          - name: text
            label: Text
            type: text
            required: true
            description: Slova se při čtení rozsvěcují jedno po druhém, proto tu nejde kurzíva.
      - name: nadtitulek_hodnot
        label: Nadtitulek slajdů s hodnotami
        type: string
        required: true
        description: Stejný na všech deseti, pořadí „1/10“ se k němu doplní samo.
      - name: hodnoty
        label: 11–20 · Hodnoty
        type: object
        list:
          min: 10
          max: 10
        description: Přesně deset hodnot, v pořadí, v jakém jdou na webu. Každá má svůj otisk.
        collapsible:
          collapsed: true
          summary: '{slovo} – {jak}'
        fields:
          - name: slovo
            label: Hodnota
            type: string
            required: true
            description: Velké slovo, malými písmeny – „otevřená“.
          - name: jak
            label: Jak
            type: string
            required: true
            description: Příslovce vedle – „přitažlivě“.

  - name: zrcadlo
    label: 21 · Zrcadlo
    type: file
    path: src/obsah/zrcadlo.yml
    format: yaml
    fields:
      - name: nadtitulek
        label: Nadtitulek
        type: string
        required: true
      - name: slovo
        label: Velké slovo
        type: string
        required: true
      - name: otazka
        label: Otázka k zamyšlení
        type: string
      - name: popis_fotky
        label: Popis fotky
        type: string
        description: Pro nevidomé a vyhledávače.

  - name: spolecne
    label: Společné a sdílení
    type: file
    path: src/obsah/spolecne.yml
    format: yaml
    fields:
      - name: podpis
        label: Podpis
        type: string
        required: true
        description: Vpravo dole na každém slajdu, pokud slajd nemá vlastní – „církev jako kráva“.
      - name: napoveda
        label: Nápověda k ovládání
        type: string
        description: Drobný text dole na úvodním slajdu, zmizí po prvním posunu.
      - name: sdileni
        label: Sdílení odkazu
        type: object
        description: Co se ukáže, když někdo pošle odkaz na WhatsApp, Messenger nebo Facebook.
        fields:
          - name: titulek_stranky
            label: Název v panelu prohlížeče
            type: string
            required: true
          - name: titulek_nahledu
            label: Titulek náhledu
            type: string
            required: true
          - name: popis
            label: Popis
            type: text
            required: true
            description: Jedna až dvě věty pod titulkem náhledu. Vidí je i vyhledávače.
          - name: popis_obrazku
            label: Popis obrázku náhledu
            type: string
            description: Pro nevidomé. Samotný obrázek se fotí z úvodního slajdu (build.py --og).
settings:
  content:
    merge: true
