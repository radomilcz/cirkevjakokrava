# Vygenerováno z .pages.yml (build.py) – needitovat, změny patří do .pages.yml
backend:
  name: github
  repo: radomilcz/cirkevjakokrava
  branch: main
  commit_messages:
    update: 'Texty: {{path}} (Sveltia)'
site_url: https://manifest.cirkevjakokrava.cz
media_folder: src/assets/nahrane
collections:
- name: manifest
  label: Manifest
  editor:
    preview: false
  files:
  - name: uvod
    label: 00 · Úvod
    file: src/obsah/uvod.yml
    fields:
    - name: nadtitulek
      label: Nadtitulek
      widget: string
      required: true
    - name: napis
      label: Velký nápis
      widget: string
      required: true
    - name: podnadpis
      label: Podnadpis
      widget: string
      required: true
    - name: popis_fotky
      label: Popis fotky
      widget: string
      required: false
  - name: predmluva
    label: 01 · Předmluva
    file: src/obsah/predmluva.yml
    fields:
    - name: nadtitulek
      label: Nadtitulek
      widget: string
      required: true
    - name: kapitoly
      label: Kapitoly
      widget: list
      required: false
      fields:
      - name: maly_titulek
        label: Malý titulek nad nadpisem
        widget: string
        required: false
      - name: nadpis
        label: Nadpis
        widget: string
        required: true
      - name: odstavce
        label: Odstavce
        widget: list
        required: true
        field:
          widget: text
          name: radek
          label: Odstavce
      - name: otazka
        label: Zvýrazněná otázka
        widget: string
        required: false
      - name: odstavce_po_otazce
        label: Odstavce za otázkou
        widget: list
        required: false
        field:
          widget: text
          name: radek
          label: Odstavce za otázkou
      collapsed: true
      summary: '{{fields.nadpis}}'
    - name: otazka
      label: Otázka dole
      widget: string
      required: false
  - name: poslani
    label: 02–08 · Poslání
    file: src/obsah/poslani.yml
    fields:
    - name: co_delame
      label: 02 · Co děláme?
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok po řádcích
        widget: list
        required: true
        field:
          widget: string
          name: radek
          label: Výrok po řádcích
      - name: otazka
        label: Otázka k zamyšlení
        widget: string
        required: false
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
    - name: lasko
      label: 03 · Lásko, to je Kravařsko!
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok po řádcích
        widget: list
        required: true
        field:
          widget: string
          name: radek
          label: Výrok po řádcích
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
    - name: jak_to_delame
      label: 04 · Jak to děláme?
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok po řádcích
        widget: list
        required: true
        field:
          widget: string
          name: radek
          label: Výrok po řádcích
      - name: otazka
        label: Otázka k zamyšlení
        widget: string
        required: false
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
    - name: kennedy
      label: 05 · Ich bin ein Kuhländler
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok – přesně dva řádky
        widget: list
        required: true
        min: 2
        max: 2
        field:
          widget: string
          name: radek
          label: Výrok – přesně dva řádky
      - name: otazka
        label: Otázka k zamyšlení
        widget: string
        required: false
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
      - name: popis_fotky
        label: Popis portrétu
        widget: string
        required: false
    - name: pro_koho
      label: 06 · Pro koho?
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok po řádcích
        widget: list
        required: true
        field:
          widget: string
          name: radek
          label: Výrok po řádcích
      - name: otazka
        label: Otázka k zamyšlení
        widget: string
        required: false
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
    - name: krava
      label: 07 · Kráva má Boží design
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: slovo
        label: Velké slovo
        widget: string
        required: true
      - name: dovetek
        label: Dovětek
        widget: string
        required: false
      - name: popis_fotky
        label: Popis fotky
        widget: string
        required: false
    - name: proc
      label: 08 · Proč vlastně?
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: vyrok
        label: Výrok po řádcích
        widget: list
        required: true
        field:
          widget: string
          name: radek
          label: Výrok po řádcích
      - name: otazka
        label: Otázka k zamyšlení
        widget: string
        required: false
      - name: podpis
        label: Podpis vpravo dole
        widget: string
        required: false
        hint: Prázdné = společný podpis.
  - name: kultura
    label: 09–20 · Kultura a hodnoty
    file: src/obsah/kultura.yml
    fields:
    - name: uvod
      label: 09 · Kultura – slajd s fotkou
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: slovo
        label: Velké slovo
        widget: string
        required: true
      - name: dovetek
        label: Dovětek
        widget: string
        required: false
      - name: popis_fotky
        label: Popis fotky
        widget: string
        required: false
    - name: odstavec
      label: 10 · Odstavec o hodnotách
      widget: object
      required: false
      fields:
      - name: nadtitulek
        label: Nadtitulek
        widget: string
        required: true
      - name: text
        label: Text
        widget: text
        required: true
    - name: nadtitulek_hodnot
      label: Nadtitulek slajdů s hodnotami
      widget: string
      required: true
    - name: hodnoty
      label: 11–20 · Hodnoty
      widget: list
      required: false
      min: 10
      max: 10
      fields:
      - name: slovo
        label: Hodnota
        widget: string
        required: true
      - name: jak
        label: Jak
        widget: string
        required: true
      collapsed: true
      summary: '{{fields.slovo}} – {{fields.jak}}'
  - name: zrcadlo
    label: 21 · Zrcadlo
    file: src/obsah/zrcadlo.yml
    fields:
    - name: nadtitulek
      label: Nadtitulek
      widget: string
      required: true
    - name: slovo
      label: Velké slovo
      widget: string
      required: true
    - name: otazka
      label: Otázka k zamyšlení
      widget: string
      required: false
    - name: popis_fotky
      label: Popis fotky
      widget: string
      required: false
  - name: spolecne
    label: Společné a sdílení
    file: src/obsah/spolecne.yml
    fields:
    - name: podpis
      label: Podpis
      widget: string
      required: true
    - name: napoveda
      label: Nápověda k ovládání
      widget: string
      required: false
    - name: sdileni
      label: Sdílení odkazu
      widget: object
      required: false
      fields:
      - name: titulek_stranky
        label: Název v panelu prohlížeče
        widget: string
        required: true
      - name: titulek_nahledu
        label: Titulek náhledu
        widget: string
        required: true
      - name: popis
        label: Popis
        widget: text
        required: true
      - name: popis_obrazku
        label: Popis obrázku náhledu
        widget: string
        required: false
