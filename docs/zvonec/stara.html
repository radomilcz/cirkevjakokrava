<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only our own scripts and the GitHub API (plus OpenStreetMap maps in a frame). The token lives in the browser, so nothing foreign may run here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Zvonec (původní verze) – Církev jako kráva</title>
<meta name="description" content="Kdo co kdy dělá: kalendář, lidi, služby a upozornění.">
<meta name="theme-color" content="#f2ded4">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preload" href="../assets/fonts/Agrandir-NarrowBlack.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="../assets/fonts/Agrandir-Regular.woff" as="font" type="font/woff" crossorigin>
<script src="ui/palette.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/people.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/events.css">
<link rel="stylesheet" href="css/roster.css">
<link rel="stylesheet" href="css/groups.css">
<link rel="stylesheet" href="css/formats.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/public.css">
<!-- the brand palettes (generated by zvonec/palettes.mjs): last, so the chosen palette sets every colour -->
<link rel="stylesheet" href="css/palettes.css">
<script type="module" src="app.js"></script>
</head>
<body>

<!-- The shell (BUILD.md „Shell“): header across the top; under it the sidebar and the stage (the page
     sheet). Phone (< 960 px): the header has the brand and Menu, the sidebar becomes a sheet and app.js
     moves the colour picker (the bullseye, ui/palette-picker.js – app.js mounts it next to the person) and
     the person into it. app.js fills the navigation per role. -->
<header class="appbar">
  <a class="brand-link" href="#"><span class="brand">církev jako kráva</span><span class="app-name">Zvonec</span></a>
  <div class="appbar-tools">
    <p class="save-status" role="status" aria-live="polite"></p>
    <div class="account"></div>
    <a class="btn btn-solid btn-s topbar-signin" href="#prihlaseni" hidden>Přihlas se</a>
    <button class="btn btn-surface menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg><span class="menu-toggle-label">Menu</span></button>
  </div>
</header>

<div class="app-body">
  <div class="scrim" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Menu">
    <div class="sidebar-head">
      <span class="brand">církev jako kráva</span>
      <button class="btn btn-ghost btn-icon sheet-close" type="button" aria-label="Zavři menu" title="Zavři menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <nav class="nav" aria-label="Hlavní menu"></nav>
    <div class="sidebar-foot">
      <div class="sheet-tools"></div>
      <nav class="nav nav-foot" aria-label="Další odkazy"></nav>
    </div>
  </aside>
  <main id="content" class="stage" tabindex="-1">
    <div class="page"><p class="loading">Načítám…</p></div>
    <noscript><p>Zvonec běží v prohlížeči – bez JavaScriptu to nepůjde.</p></noscript>
  </main>
</div>

<dialog class="dialog" id="dialog"></dialog>
<div class="toasts" aria-live="polite"></div>

</body>
</html>
