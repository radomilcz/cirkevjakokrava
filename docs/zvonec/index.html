<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Jen vlastní skripty a GitHub API. Token leží v prohlížeči, tak sem nesmí nic cizího. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Zvonec – Církev jako kráva</title>
<meta name="description" content="Kdo co kdy dělá: kalendář, lidi, služby a kolize.">
<meta name="theme-color" content="#3b2f2f">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preload" href="../assets/fonts/Agrandir-NarrowBlack.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="../assets/fonts/Agrandir-Regular.woff" as="font" type="font/woff" crossorigin>
<script src="paleta.js"></script>
<link rel="stylesheet" href="styl.css">
<script type="module" src="app.js"></script>
</head>
<body>

<div class="pozadi" aria-hidden="true">
  <svg class="otisk a"><use href="otisk.svg#o"/></svg>
  <svg class="otisk b"><use href="otisk.svg#o"/></svg>
</div>

<header class="lista">
  <a class="brand" href="#kalendar">církev jako kráva</a>
  <nav class="menu" aria-label="Hlavní">
    <a href="#kalendar" data-sekce="kalendar">Kalendář</a>
    <a href="#rozpis" data-sekce="rozpis">Rozpis</a>
    <a href="#lide" data-sekce="lide">Lidé</a>
    <a href="#sluzby" data-sekce="sluzby">Služby</a>
    <a href="#formaty" data-sekce="formaty">Formáty</a>
    <a href="#kolize" data-sekce="kolize">Kolize <span class="pocet" hidden></span></a>
    <a href="#nastaveni" data-sekce="nastaveni">Nastavení</a>
    <div class="paleta">
      <button class="prepinac" type="button" aria-expanded="false" aria-haspopup="true" aria-label="Barvy" title="Barvy"><span class="terc"></span></button>
      <div class="paleta-menu" role="menu" aria-label="Barvy" hidden>
        <!-- zelená a krém, krém a zelená, zelená a růžová, růžová a modrá: na drobný text v aplikaci
             nemají dost kontrastu (pod 4,5 : 1) – v Otázkách na tělo zůstávají, tady ne -->
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="hlina-ruzova" title="Hlína a růžová" aria-label="Hlína a růžová"><span class="terc"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="ruzova-hlina" title="Růžová a hlína" aria-label="Růžová a hlína"><span class="terc"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="modra-krem" title="Modrá a krém" aria-label="Modrá a krém"><span class="terc"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="krem-modra" title="Krém a modrá" aria-label="Krém a modrá"><span class="terc"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="krem-hlina" title="Krém a hlína" aria-label="Krém a hlína"><span class="terc"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-paleta="" class="auto">Podle zařízení</button>
      </div>
    </div>
  </nav>
  <p class="ulozeni" role="status" aria-live="polite"></p>
</header>

<main id="obsah" class="page" tabindex="-1">
  <p class="nacitam">Načítám…</p>
  <noscript><p>Zvonec běží v prohlížeči – bez JavaScriptu to nepůjde.</p></noscript>
</main>

<footer class="pata">
  <p class="brand">církev jako kráva</p>
</footer>

<dialog class="dialog" id="dialog"></dialog>
<div class="hlasky" aria-live="polite"></div>

</body>
</html>
