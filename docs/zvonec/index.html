<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Only our own scripts and the GitHub API (plus OpenStreetMap maps in a frame). The token lives in the browser, so nothing foreign may run here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Zvonec – Církev jako kráva</title>
<meta name="description" content="Kdo co kdy dělá: kalendář, lidi, služby a upozornění.">
<meta name="theme-color" content="#3b2f2f">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preload" href="../assets/fonts/Agrandir-NarrowBlack.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="../assets/fonts/Agrandir-Regular.woff" as="font" type="font/woff" crossorigin>
<script src="ui/palette.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/people.css">
<link rel="stylesheet" href="css/events.css">
<link rel="stylesheet" href="css/roster.css">
<link rel="stylesheet" href="css/formats.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/public.css">
<script type="module" src="app.js"></script>
</head>
<body>

<div class="backdrop" aria-hidden="true">
  <svg class="imprint a"><use href="imprint.svg#o"/></svg>
  <svg class="imprint b"><use href="imprint.svg#o"/></svg>
</div>

<!-- the header across the whole app: brand and app name left; save status, colours and the signed-in
     person (or Přihlásit se) right. On a phone it is the top bar with the Menu button; app.js moves the
     colours and the person into the sheet there. -->
<header class="appbar">
  <a class="brand-link" href="#"><span class="brand">církev jako kráva</span><span class="app-name">Zvonec</span></a>
  <div class="appbar-tools">
    <p class="save-status" role="status" aria-live="polite"></p>
    <div class="palette">
      <button class="switcher" type="button" aria-expanded="false" aria-haspopup="true" aria-label="Barvy" title="Barvy"><span class="bullseye"></span></button>
      <div class="palette-menu" role="menu" aria-label="Barvy" hidden>
        <!-- green and cream, cream and green, green and pink, pink and blue: not enough contrast for
             small app text (below 4.5 : 1) – they stay in Otázky na tělo, not here -->
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="clay-pink" title="Hlína a růžová" aria-label="Hlína a růžová"><span class="bullseye"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="pink-clay" title="Růžová a hlína" aria-label="Růžová a hlína"><span class="bullseye"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="blue-cream" title="Modrá a krém" aria-label="Modrá a krém"><span class="bullseye"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="cream-blue" title="Krém a modrá" aria-label="Krém a modrá"><span class="bullseye"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="cream-clay" title="Krém a hlína" aria-label="Krém a hlína"><span class="bullseye"></span></button>
        <button type="button" role="menuitemradio" aria-checked="false" data-palette="" class="auto">Podle zařízení</button>
      </div>
    </div>
    <div class="account"></div>
    <a class="btn small primary topbar-signin" href="#prihlaseni" hidden>Přihlásit se</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar"><span class="menu-toggle-icon" aria-hidden="true"></span><span class="menu-toggle-label">Menu</span></button>
  </div>
</header>

<div class="scrim" hidden></div>

<!-- desktop: the column on the left under the header, as tall as the page; phone: the sheet behind the
     Menu button. app.js fills the navigation per access level (and for visitors who are not signed in). -->
<aside class="sidebar" id="sidebar" aria-label="Menu">
  <div class="sidebar-inner">
    <div class="sidebar-head">
      <span class="brand">církev jako kráva</span>
      <button class="btn small sheet-close" type="button" aria-label="Zavřít menu">Zavřít</button>
    </div>
    <nav class="nav" aria-label="Hlavní menu"></nav>
    <div class="sidebar-foot">
      <div class="sheet-tools"></div>
      <div class="sidebar-links"></div>
    </div>
  </div>
</aside>

<main id="content" class="page" tabindex="-1">
  <p class="loading">Načítám…</p>
  <noscript><p>Zvonec běží v prohlížeči – bez JavaScriptu to nepůjde.</p></noscript>
</main>

<dialog class="dialog" id="dialog"></dialog>
<div class="toasts" aria-live="polite"></div>

</body>
</html>
