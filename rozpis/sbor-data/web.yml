# Vzor pro SOUKROMÉ datové repo (radomilcz/sbor-data) – zkopíruj do .github/workflows/web.yml.
#
# Vystaví Rozpis na https://kalendar.cirkevjakokrava.cz jako Mobilise Playbook: aplikace se vezme
# z veřejného repa s webem, přidá se k ní pristup.json (zapečetěná přihlášení – žádná jména,
# žádný klíč v čitelné podobě) a jde to na GitHub Pages tohohle repa.
# rozpis.json (lidi, telefony, služby) na web NIKDY nejde – čte se až po přihlášení přes API.
#
# Jednorázově: Settings → Pages → Source: GitHub Actions; Custom domain kalendar.cirkevjakokrava.cz;
# u DNS záznam CNAME kalendar → radomilcz.github.io. (Pages ze soukromého repa = GitHub Pro.)
name: Web

on:
  push:
    branches: [main]
    paths: [pristup.json, .github/workflows/web.yml]   # nové / zrušené přihlášení → za minutu venku
  schedule:
    - cron: "41 3 * * *"        # jednou denně – ať se dostanou i úpravy aplikace z veřejného repa
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sestav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pristup.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          repository: radomilcz/cirkevjakokrava
          path: web
          sparse-checkout: |
            docs/rozpis
            docs/assets

      - name: Složit web
        run: |
          mkdir -p site/assets
          cp -r web/docs/rozpis/. site/
          cp -r web/docs/assets/fonts site/assets/
          cp web/docs/assets/favicon.svg web/docs/assets/favicon-32.png web/docs/assets/icon-180.png site/assets/
          if [ -f pristup.json ]; then cp pristup.json site/; else echo '{"v":1,"pristupy":[]}' > site/pristup.json; fi
          echo "{\"vlastnik\":\"${GITHUB_REPOSITORY%%/*}\",\"repo\":\"${GITHUB_REPOSITORY#*/}\"}" > site/repo.json
          echo "kalendar.cirkevjakokrava.cz" > site/CNAME
          # pojistka: na web nesmí nic čitelného z dat
          if [ -f site/rozpis.json ]; then echo "::error::rozpis.json nesmí na web"; exit 1; fi
          if grep -q '"jmeno"' site/pristup.json; then echo "::error::pristup.json obsahuje jména"; exit 1; fi
          ls -la site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  nasad:
    needs: sestav
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v4
