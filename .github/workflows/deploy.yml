# Nasazení na www.cirkevjakokrava.cz/manifest
#
# Po každém pushi do main se docs/ (hotová prezentace) nahraje přes FTPS
# do složky manifest/ v kořeni webu. Potřebuje tři tajemství v nastavení repa
# (Settings → Secrets and variables → Actions):
#   FTP_HOST      např. cirkevjakokrava.cz nebo IP serveru
#   FTP_USER      FTP uživatel z ISPConfigu (Sites → FTP-User)
#   FTP_PASSWORD  jeho heslo
#
# Cílová složka: u ISPConfigu je webroot /var/www/<domena>/web/, FTP uživatel
# se obvykle přihlásí přímo do /var/www/<domena>/, proto cesta "web/manifest/".
# Když se FTP uživatel přihlašuje rovnou do webrootu, změň server-dir na "manifest/".
name: Deploy to cirkevjakokrava.cz/manifest

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload docs/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: docs/
          server-dir: web/manifest/
