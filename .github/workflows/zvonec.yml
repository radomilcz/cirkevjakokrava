# Zvonec tests (conflict rules, store and merge, sign-in, demo, data-repo check).
# Runs only when Zvonec changes.
name: Zvonec tests

on:
  push:
    branches: [main]
    paths: [docs/zvonec/**, zvonec/**, .github/workflows/zvonec.yml]
  pull_request:
    paths: [docs/zvonec/**, zvonec/**, .github/workflows/zvonec.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: node --test zvonec/test/*.test.mjs

      - name: Check the syntax of every module
        run: |
          find docs/zvonec -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          for f in zvonec/*.mjs; do node --check "$f"; done
