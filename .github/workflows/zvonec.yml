# Testy Zvonce (kolize, slučování, kalendář). Běží jen když se Zvonec změní.
name: Zvonec

on:
  push:
    branches: [main]
    paths: [docs/zvonec/**, zvonec/**]
  pull_request:
    paths: [docs/zvonec/**, zvonec/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy
        run: node --test zvonec/test/*.test.mjs
      - name: Syntaxe všech modulů
        run: for f in docs/zvonec/*.js zvonec/*.mjs; do node --check "$f"; done
